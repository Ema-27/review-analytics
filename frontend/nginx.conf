# Serve la SPA React (con fallback su index.html per il routing lato client
# di React Router) e inoltra le chiamate /api al container backend FastAPI,
# risolto tramite la rete Docker Compose col nome del servizio "backend".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # DNS interno di Docker Compose. Risolvere `backend` a ogni richiesta
        # (tramite variabile) invece che una sola volta all'avvio: cosi' se il
        # container backend viene ricreato (nuovo IP) nginx non resta bloccato
        # sul vecchio indirizzo con errori 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend backend;
        # $request_uri = path + query originali (gia' con prefisso /api/, che il
        # backend serve tale e quale): nessun rewrite del path necessario.
        proxy_pass http://$upstream_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Le generazioni AI su CPU (LLM locale) possono durare oltre 1-2 minuti,
        # specie alla prima richiesta (caricamento modello). Timeout generosi.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
